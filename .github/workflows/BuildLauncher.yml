name: 构建启动器
on: workflow_dispatch

jobs:
  build-launcher:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build launcher
        run: |
          chmod a+x ./bin/*
          chmod a+x build-launcher.sh
          ./build-launcher.sh -l -c

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          path: build-output/*.zip